dest:
  device: /dev/disk/by-id/usb-USB_SanDisk_3.2Gen1_*-0:0
  filesystem:
    name: btrfs
    options: noatime,compress-force=zstd
  sizes:
    boot: 512MB
    luks: 64GB
    # rest of device is filled with an unencrypted exFAT partition
  kernel: /boot/vmlinuz-linux

postcommands:
  # sign kernel image with own keys for UEFI secure boot
  - sbctl sign $MOUNT$/efi/EFI/BOOT/BOOTX64.EFI

  # avoid hardware dependencies
  - ln -sf /dev/null $MOUNT$/etc/systemd/system/multi-user.target.wants/tlp.service
  - ln -sf /dev/null $MOUNT$/etc/systemd/system/basic.target.wants/usbguard.service
  - ln -sf /dev/null $MOUNT$/etc/systemd/system/multi-user.target.wants/usbguard-dbus.service
  - ln -sf /dev/null $MOUNT$/etc/systemd/system/timers.target.wants/btrfs-scrub@-.timer
  - ln -sf /dev/null $MOUNT$/etc/systemd/system/timers.target.wants/fstrim.timer

  - rm -f $MOUNT$/home/*/.config/autostart/*extcloud*
  - rm -f $MOUNT$/home/*/.config/autostart/*yncthing*
  - ln -sf /dev/null $MOUNT$/home/*/.config/systemd/user/default.target.wants/*nextcloud*.service
  - ln -sf /dev/null $MOUNT$/home/*/.config/systemd/user/default.target.wants/*yncthing.service
  - rm -f $MOUNT$/usr/bin/nextcloud
  - rm -f $MOUNT$/usr/bin/syncthing

  # disable auto-startx
  - rm -f $MOUNT$/etc/systemd/system/*/auto-x11.service

  # change statusbar colors
  - sed -i -E 's/^theme\.bg_normal.*/theme.bg_normal = "#d9304f"/' $MOUNT$/home/*/.config/awesome/theme.lua
  - sed -i -E 's/^theme\.fg_normal.*/theme.fg_normal = "#ffffff"/' $MOUNT$/home/*/.config/awesome/theme.lua

exclude:
  - "**/.cache/*"
  - "**/CacheStorage"
  - "**/component_crx_cache"
  - "**/.fr-*/*"
  - "/home/*/doc/**/*.mp4"
  - /home/*/.cargo
  - /home/*/.rustup
  - /home/*/.npm/_cacache
  - /home/*/.ollama
  - /home/*/.local/cache
  - /home/*/.config/ES-DE
  - /home/*/.config/Ryujinx
  - /home/*/.wine
  - /home/*/.kube/cache
  - /home/*/.local/share/Steam
  - /home/*/.local/share/lutris
  - /home/*/.local/share/flatpak
  - /home/*/.local/share/umu
  - /home/*/.local/share/yay
  - /home/*/.local/share/Trash/*
  - /home/*/.local/share/vifm/Trash
  - /home/*/.local/share/thumbnails/*
  - /home/*/.local/share/blur/*
  - /home/*/downloads/*
  - /home/*/data/backup
  - /home/*/sync/roms
  - /home/*/games
  - /home/*/data/ios-backup
  - /home/*/data/splunk
  - /home/*/data/vm
  - /home/*/photos
  - /home/*/tmp
  - /home/*/videos
  - /home/*/.ghcup
  - /home/*/.stack
  - /home/*/.cabal/packages
  - /home/*/infra/PKGBUILD/
  - /srv/kube
  - /usr/share/gtk-doc/*
  - /usr/share/render96ex
  - /usr/share/texmf-dist
  - /var/cache/*
  - /home/*/.local/share/containers
  - /var/lib/docker/*
  - /var/lib/pacman/sync/*
  - /var/lib/texmf/*
  - /var/log/*
  - /var/tmp/*
